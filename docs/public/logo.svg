<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="neuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA733" />
      <stop offset="50%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#E06D00" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8C00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#glow)" />

  <!-- React Orbits styled in Neutralino theme -->
  <g fill="none" stroke="url(#neuGrad)" stroke-width="7" opacity="0.85">
    <ellipse cx="100" cy="100" rx="80" ry="30" />
    <ellipse cx="100" cy="100" rx="80" ry="30" transform="rotate(60 100 100)" />
    <ellipse cx="100" cy="100" rx="80" ry="30" transform="rotate(120 100 100)" />
  </g>

  <!-- Central Core (Neutralino node) -->
  <circle cx="100" cy="100" r="22" fill="url(#neuGrad)" />
  <circle cx="100" cy="100" r="10" fill="#FFFFFF" opacity="0.9" />
</svg>
